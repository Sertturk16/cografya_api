# Local development infrastructure for the Coğrafya API.
#
#   docker compose up -d
#
# Postgres is wired into the app from PR-1a: point DATABASE_URL (see
# .env.example) at this instance, then run `pnpm migration:run`. Redis is read by
# the app from the marine M2 PR onwards: set REDIS_URL to use it. Leaving REDIS_URL
# unset is a supported DEVELOPMENT mode (in-process LRU, announced at boot); it is
# refused in production with MARINE_ENABLED=true (DEC 2026-07-29b).
#
# Credentials below are dev-only defaults (see .env.example); they are NOT
# secrets and are overridable via a local .env.

name: cografya-api

services:
  postgres:
    image: postgres:16-alpine
    container_name: cografya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cografya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cografya_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cografya}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cografya} -d ${POSTGRES_DB:-cografya}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cografya-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

# Local development infrastructure for the Coğrafya API.
#
#   docker compose up -d
#
# Postgres is wired into the app from PR-1a: point DATABASE_URL (see
# .env.example) at this instance, then run `pnpm migration:run`. Redis is read by
# the app from the marine M2 PR onwards: set REDIS_URL to use it. Leaving REDIS_URL
# unset is a supported DEVELOPMENT mode (in-process LRU, announced at boot); it is
# refused in production with MARINE_ENABLED=true (DEC 2026-07-29b).
#
# Credentials below are dev-only defaults (see .env.example); they are NOT
# secrets and are overridable via a local .env.

name: cografya-api

services:
  postgres:
    image: postgres:16-alpine
    container_name: cografya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cografya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cografya_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cografya}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cografya} -d ${POSTGRES_DB:-cografya}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cografya-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # The API itself, for the web dev server on :3000 (`docker compose --profile app up -d api`).
  # In the `app` profile so a bare `docker compose up -d` still starts only Postgres + Redis.
  #
  # IT COMPILES TO .dist-container/, NOT dist/ (tsconfig.container.json). The container runs as
  # root on the bind-mounted tree; writing dist/ left it root-owned and every host `pnpm build`
  # / `openapi:generate` / `migration:*` failed with EACCES. A volume over /app/dist does not
  # work: `deleteOutDir` cannot remove a mount point (EBUSY).
  #
  # Env comes from the local .env (git-ignored; see .env.example), except MAIL_TRANSPORT: the
  # dev container never sends real mail, whatever .env sets for host-side runs.
  api:
    profiles: [app]
    image: node:24
    container_name: cografya-api-dev
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      MAIL_TRANSPORT: noop
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command: >-
      sh -c "corepack enable && corepack prepare pnpm@11.2.2 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm exec nest start --watch --path tsconfig.container.json"

volumes:
  postgres_data:
  # Fixed name: the volume the hand-run container used, so an existing install is reused.
  api_node_modules:
    name: cografya_api_node_modules
